
{% extends "base.html" %}

{% block title %}Login - Student Study Planner{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back!</h1>
        <p>Login to manage your academic activities.</p>

        <form method="POST" action="{{ url_for('login') }}">

            <label>Email Address</label>
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="btn">
                Login
            </button>

        </form>

        <p class="auth-link">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register here</a>
        </p>

    </div>

</div>

{% endblock %}
